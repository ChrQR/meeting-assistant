[project]
dependencies = [
  "httpx>=0.28.1",
  "pydantic-ai-slim[openrouter]",
  "pydantic",
  "pydantic-settings",
  "logfire",
  "numpy>=2.5.3",
  "sqlmodel>=0.0.48",
  "soundfile>=0.14.0",
  "torch>=2.14.1",
  "speechbrain>=1.1.1",
  "pgvector>=0.5.0",
  "aiofiles>=25.1.0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
  "fastapi[all]>=0.143.0",
]
name = "meeting-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "ChrQR", email = "christian@rannes.dev" }]
requires-python = ">=3.13"

[project.scripts]
meeting-agent = "meeting_agent.main:run"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
