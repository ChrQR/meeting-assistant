version: "2"
sql:
  - engine: postgresql
    queries: internal/database/queries/*.sql
    schema: internal/database/migrations/*.sql
    gen:
      go:
        package: database
        out: internal/database
        sql_package: pgx/v5
        overrides:
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: Time
              pointer: true
          - db_type: "timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: Time
              pointer: false
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: UUID
              pointer: false

plugins: []
rules: []
options: {}
